name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Oder 'master', je nachdem wie dein Haupt-Branch heißt

# Berechtigungen für das Ausführen und Deployen setzen
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Nutzt pnpm oder yarn falls du ein anderes Tool verwendest

      - name: Dependencies installieren
        run: npm ci

      - name: Projekt bauen
        run: npm run build

      - name: Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Der Ordner, den Vite nach 'npm run build' erzeugt

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4